pre-commit:
  parallel: true
  jobs:
    - name: biome
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: secretlint
      run: pnpm exec secretlint {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm typecheck
    - name: dependencies
      run: pnpm lint:deps
    - name: unused
      run: pnpm lint:unused
    - name: tests
      run: pnpm exec vitest run --changed origin/main

post-merge:
  jobs:
    - name: install
      run: pnpm install
      files: git diff --name-only HEAD@{1} HEAD
      glob: "pnpm-lock.yaml"

post-checkout:
  jobs:
    - name: install
      run: pnpm install
      files: git diff --name-only {1} {2}
      glob: "pnpm-lock.yaml"
